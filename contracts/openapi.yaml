openapi: 3.1.0
info:
  title: Myunivokai Gateway API
  version: 1.0.0
  description: The browser-facing API. Domain services are reachable only through NATS.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: "{protocol}://{host}"
    description: Configurable gateway endpoint
    variables:
      protocol:
        default: http
        enum: [http, https]
      host:
        default: localhost:41800
security: []
paths:
  /api/v1/healthz:
    get:
      summary: Check gateway liveness
      operationId: getGatewayLiveness
      responses:
        "200": { description: Gateway process is alive }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/readyz:
    get:
      summary: Check gateway readiness
      operationId: getGatewayReadiness
      responses:
        "200": { description: NATS and Redis are ready }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: A required edge dependency is unavailable }
  /api/auth/signup:
    post:
      summary: Register an end-user account and sign it in
      operationId: signUpEndUser
      description: >-
        Creates an account with the `web` audience and returns a session. The
        email address is stored UNVERIFIED and no mail is sent, so nothing may
        key off it — see the identity plan's section 5 and decision 11, and the
        two costs that decision accepts: there is no password reset until Phase
        D, and no trust may attach to the address.

        A 409 discloses that an address already holds an account. That is
        accepted rather than hidden: uniform signup responses require email
        verification, and every alternative either needs an inbox or turns the
        endpoint into a password oracle. Login is uniform and stays uniform.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignUpRequest" }
      responses:
        "201":
          description: The account was created and signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/EmailUnavailable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/auth/login:
    post:
      summary: Sign in to the product
      operationId: logInEndUser
      description: >-
        Returns the tokens in the response BODY and sets no cookie, which is
        the identity plan's section 4.1 decision: the web app and the gateway
        are two different sites, so a session cookie would need SameSite=None
        and fail silently on Safari and Firefox. The client sends
        `Authorization: Bearer <accessToken>` by hand, which is also why this
        design has no CSRF surface at all.

        The response is identical whether the address exists, belongs to a
        staff account, or the password is wrong.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200":
          description: A new session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AccountUnavailable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/auth/refresh:
    post:
      summary: Rotate a product session
      operationId: refreshEndUserSession
      description: >-
        Single use. The presented token is consumed and a whole new pair is
        returned; presenting a token that was already used revokes its entire
        rotation family, because that means the previous response was
        intercepted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: A rotated session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AccountUnavailable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/auth/logout:
    post:
      summary: Sign out of the product
      operationId: logOutEndUser
      description: >-
        Revokes the presented token's whole rotation family. The token is taken
        from the body rather than from a session, so signing out works when the
        access token has already expired — an ordinary state given a 7-day
        access token and a 3-month refresh token. An already-invalid token is a
        no-op: the caller's goal is already true.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "204": { description: The session family was revoked }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/me:
    get:
      summary: Get the signed-in account
      operationId: getSignedInAccount
      description: >-
        Reads the account named by the token's subject; a caller cannot ask
        about any other account.

        This route reaches auth-service, which sleeps. A client must not call
        it on every page load — the account it needs is already in the session
        response it stored at sign-in — because the identity plan's section 11
        wake budget assumes a signed-in visitor browsing worlds wakes
        auth-service not at all.
      security:
        - productAccessToken: []
      responses:
        "200":
          description: The signed-in account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductAccount" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/me/profile:
    get:
      summary: Get the signed-in account's profile
      operationId: getAccountProfile
      description: >-
        The account's own page: who they are, and the defaults the
        create-world form is filled from. Reads the account named by the
        token's subject; there is no account id in the route or in the body, so
        a caller cannot ask about any other account.

        An account that has never saved a profile gets an EMPTY one and not a
        404. The page's job is to be opened before it has ever been saved, and
        a 404 would make every client treat "not filled in yet" as a failure.
      security:
        - productAccessToken: []
      responses:
        "200":
          description: The profile, saved or empty
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountProfile" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ProfileNotAvailable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
    patch:
      summary: Replace the signed-in account's profile
      operationId: updateAccountProfile
      description: >-
        Replaces the profile WHOLE. Every field the page renders is sent on
        every save, because a merge would make a field somebody cleared
        indistinguishable from one the request did not mention — on a form of
        optional text fields, the difference between "delete my goal" and
        "leave my goal alone".

        `creationDefaults` is validated as a DRAFT and never as a submission:
        every ceiling and every vocabulary applies, and not one minimum does. A
        half-filled profile is a legitimate thing to save; demanding a complete
        world before somebody can record their own name would make this page
        unusable the first time it is opened.

        `displayName` writes the account's name, which is the SAME value
        returned in `creationDefaults.nickname`. There is one name.
      security:
        - productAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountProfile" }
      responses:
        "200":
          description: The saved profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ProfileNotAvailable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/jobs/{jobId}:
    get:
      summary: Get an asynchronous generation job
      operationId: getGenerationJob
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Current generation state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/{family}/worlds:
    post:
      summary: Queue a world generation job
      operationId: createWorld
      parameters:
        - $ref: "#/components/parameters/Family"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./schemas/world-input.schema.json" }
      responses:
        "202":
          description: Durable generation command accepted by JetStream
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/Unavailable" }
    get:
      summary: Get worlds by identifiers
      operationId: getWorlds
      parameters:
        - $ref: "#/components/parameters/Family"
        - name: ids
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Requested world bundles
          content:
            application/json:
              schema:
                type: object
                required: [worlds]
                properties:
                   worlds:
                     type: array
                     items: { $ref: "#/components/schemas/WorldBundle" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/{family}/worlds/{worldId}:
    get:
      summary: Get a world and its variants
      operationId: getWorld
      parameters:
        - $ref: "#/components/parameters/Family"
        - $ref: "#/components/parameters/WorldId"
      responses:
        "200":
          description: World and variants
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorldBundle" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/{family}/worlds/{worldId}/variants:
    post:
      summary: Create a deterministic world variant
      operationId: createWorldVariant
      parameters:
        - $ref: "#/components/parameters/Family"
        - $ref: "#/components/parameters/WorldId"
      responses:
        "201":
          description: Deterministic AI-free variant created
          content:
            application/json:
              schema:
                type: object
                required: [variant]
                properties:
                  variant: { $ref: "#/components/schemas/WorldVariant" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/{family}/worlds/{worldId}/variants/{variantId}/select:
    post:
      summary: Select a world variant
      operationId: selectWorldVariant
      parameters:
        - $ref: "#/components/parameters/Family"
        - $ref: "#/components/parameters/WorldId"
        - $ref: "#/components/parameters/VariantId"
      responses:
        "200":
          description: Selected variant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VariantEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/{family}/worlds/{worldId}/publish:
    post:
      summary: Publish a world for public sharing
      operationId: publishWorld
      parameters:
        - $ref: "#/components/parameters/Family"
        - $ref: "#/components/parameters/WorldId"
      responses:
        "200":
          description: Public share reference
          content:
            application/json:
              schema:
                type: object
                required: [shareSlug, shareUrl]
                properties:
                   shareSlug: { type: string }
                   shareUrl: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/{family}/share/worlds/{shareSlug}:
    get:
      summary: Get a privacy-safe public world
      operationId: getPublicWorld
      parameters:
        - $ref: "#/components/parameters/Family"
        - name: shareSlug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Privacy-safe public projection
          content:
             application/json:
              schema: { $ref: "#/components/schemas/PublicWorldResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
components:
  securitySchemes:
    productAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        The Ed25519 access token returned by /api/auth/login, carried in an
        Authorization header the client sets itself. The gateway verifies the
        signature locally and checks the account's tokenVersion in Redis on
        EVERY request, which is what makes a 7-day access token revocable
        instantly and therefore defensible — see the identity plan's section
        4.4.

        Tokens minted for the `admin` audience are rejected here, and this
        token is rejected by every /api/admin route. Both directions, or the
        separation is not proven.
  parameters:
    Family:
      name: family
      in: path
      required: true
      schema: { type: string, enum: [universe, nature] }
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: string }
    WorldId:
      name: worldId
      in: path
      required: true
      schema: { type: string }
    VariantId:
      name: variantId
      in: path
      required: true
      schema: { type: string }
  schemas:
    Job:
      type: object
      additionalProperties: false
      required: [jobId, family, status, createdAt, updatedAt]
      properties:
        jobId: { type: string }
        family: { type: string, enum: [universe, nature] }
        status: { type: string, enum: [queued, processing, completed, failed] }
        profileId: { type: string }
        dnaVersionId: { type: string }
        worldId: { type: string }
        error: { $ref: "#/components/schemas/ErrorBody" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    World:
      type: object
      required: [id, nickname, archetype, sceneName, quote, visibility, shareSlug, createdAt, updatedAt]
      properties:
        id: { type: string }
        nickname: { type: string }
        role: { type: string }
        archetype: { type: string }
        sceneName: { type: string }
        quote: { type: string }
        shortNarrative: { type: string }
        visibility: { type: string, enum: [private, public] }
        shareSlug: { type: [string, "null"] }
        selectedVariantId: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WorldVariant:
      type: object
      required: [id, variantNo, seed, config, isSelected, createdAt]
      properties:
        id: { type: string }
        worldId: { type: string }
        variantNo: { type: integer, minimum: 1 }
        seed: { type: string }
        config: { type: object }
        thumbnailUrl: { type: string }
        isSelected: { type: boolean }
        createdAt: { type: string, format: date-time }
    VariantEnvelope:
      type: object
      required: [variant]
      properties:
        variant: { $ref: "#/components/schemas/WorldVariant" }
    WorldBundle:
      type: object
      required: [world, selectedVariant, variants]
      properties:
        world: { $ref: "#/components/schemas/World" }
        selectedVariant: { $ref: "#/components/schemas/WorldVariant" }
        variants:
          type: array
          items: { $ref: "#/components/schemas/WorldVariant" }
        personalityDNA: { type: object }
        natureDNA: { type: object }
    PublicWorldResponse:
      type: object
      required: [world, variant, publicDNA]
      properties:
        world:
          type: object
          required: [nickname, archetype, sceneName, quote, shortNarrative]
          properties:
            nickname: { type: string }
            archetype: { type: string }
            sceneName: { type: string }
            quote: { type: string }
            shortNarrative: { type: string }
        variant:
          type: object
          required: [seed, config]
          properties:
            seed: { type: string }
            config: { type: object }
        publicDNA: { type: object }
    Credentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password:
          type: string
          minLength: 12
          description: >-
            At least 12 characters, with no composition rules — current NIST
            guidance. Rejected on signup if it appears in the Have I Been Pwned
            corpus, and never rejected for that reason on login.
    SignUpRequest:
      type: object
      required: [email, password]
      description: >-
        Credentials plus the name the person wants to be called. A separate
        schema from Credentials rather than a `name` added to it, so LOGIN's
        accepted body is unchanged — the gateway decodes the two shapes
        separately, and a login that quietly accepted a name would be a field
        with no meaning on the one request where somebody might expect it to
        identify them.
      allOf:
        - $ref: "#/components/schemas/Credentials"
        - type: object
          properties:
            name:
              type: string
              maxLength: 32
              description: >-
                Optional, and not unique. It is what the header greets the
                account by and what the create-world form's Nickname field is
                filled with, which is why the ceiling is the same 32 characters
                that field allows. An account with no display name is valid and
                its menu falls back to the email address.
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    WorldCreationDefaults:
      type: object
      description: >-
        The create-world form's own fields. Identical in shape to the generate
        call's input, deliberately: a profile that could not express the form it
        fills would drift from it the first time the form gained a field.

        Held as a DRAFT — every field is optional here, unlike the generate
        call, where nickname, interests, traits, goal, mood, colours and style
        are all required with minimums.
      properties:
        nickname:
          type: string
          maxLength: 32
          description: >-
            Read-only in practice: it is the account's display name, projected.
            Set it through `displayName` — there is one name, stored once.
        role: { type: string, maxLength: 80 }
        goal: { type: string, maxLength: 220 }
        challenge: { type: string, maxLength: 220 }
        interests: { type: array, maxItems: 8, items: { type: string, maxLength: 32 } }
        traits: { type: array, maxItems: 6, items: { type: string, maxLength: 32 } }
        mood: { type: string }
        favoriteColors:
          type: array
          maxItems: 4
          items: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
        preferredWorldStyle:
          type: string
          description: >-
            Belongs to exactly one world family. Sending one with no
            `preferredWorldFamily` is a 400: a style saved for the wrong family
            would be refused later, at generate time, on a different screen.
    AccountProfile:
      type: object
      description: >-
        The same shape travels both ways: what GET returns is what PATCH
        accepts, so the page can load, edit and save without translating
        between two models.
      properties:
        displayName:
          type: string
          maxLength: 32
          description: >-
            The account's one name. Greets them in the header, and fills the
            create form's Nickname field whether or not `autofillCreateForm` is
            set — a name is not a preference to opt into being called by.
        fullName: { type: string, maxLength: 120 }
        gender:
          type: string
          enum: ["", female, male, non_binary, other, prefer_not_to_say]
          description: >-
            A closed set so the displayed words can be chosen and translated
            separately from the stored value. `""` means unanswered;
            `prefer_not_to_say` is an ANSWER, and the two are deliberately
            different. Nothing reads this to decide anything, and it is never
            inferred.
        preferredWorldFamily:
          type: string
          enum: ["", universe, nature, ocean]
          description: '`""` means no preference, which is a valid saved state.'
        creationDefaults: { $ref: "#/components/schemas/WorldCreationDefaults" }
        autofillCreateForm:
          type: boolean
          description: >-
            Whether the create-world form is pre-filled from this profile.
            Stored on the account rather than in one browser so it follows the
            person to their next device. Defaults to true: somebody who fills
            their profile in should see it used without finding a second
            switch. It governs the world-preference fields only.
        updatedAt: { type: string, format: date-time }
    ProductAccount:
      type: object
      required: [accountId, email, createdAt]
      description: >-
        Deliberately narrower than the admin surface's account model: no roles,
        no permissions, no super-admin flag and no kind. An end-user account
        holds none of them, and a client that can read them is one that will
        eventually decide something with them.
      properties:
        accountId: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        createdAt: { type: string, format: date-time }
    ProductSession:
      type: object
      required: [accessToken, accessExpiresAt, refreshToken, refreshExpiresAt, account]
      properties:
        accessToken: { type: string }
        accessExpiresAt: { type: string, format: date-time }
        refreshToken: { type: string }
        refreshExpiresAt: { type: string, format: date-time }
        account: { $ref: "#/components/schemas/ProductAccount" }
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: array, items: { type: object } }
        requestId: { type: string }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/ErrorBody" }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unauthenticated:
      description: >-
        No valid session. UNAUTHENTICATED means no usable credential was
        presented; SESSION_REVOKED means the token verified but the account's
        tokenVersion has moved past it, so the client must sign in again rather
        than retry. INVALID_CREDENTIALS and INVALID_REFRESH_TOKEN are the same
        status from the /api/auth routes.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    AccountUnavailable:
      description: >-
        The credential was correct and the account cannot be used:
        ACCOUNT_DISABLED (a staff member marked it inactive) or ACCOUNT_LOCKED
        (too many failed attempts, temporary).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    ProfileNotAvailable:
      description: >-
        This account has no product profile. Only an end-user account has one:
        a staff account holds an `admin` token, which the product edge refuses
        outright, so this is reachable only if something upstream is wrong.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    EmailUnavailable:
      description: >-
        EMAIL_UNAVAILABLE — that address already holds an account. See
        /api/auth/signup for why this is disclosed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    RateLimited:
      description: >-
        Too many requests. RATE_LIMITED is the per-IP bucket for this route
        group, which is much tighter than the product group's.
        TOO_MANY_ATTEMPTS is the per-email sign-in counter, which catches one
        account being guessed at from many addresses — something a per-IP
        bucket cannot see.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          required: false
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unavailable:
      description: >-
        The domain responder could not be reached. Two error codes share this
        status and they mean different things to a client. SERVICE_WAKING means
        no responder was subscribed, the gateway has started the service, and
        the request never reached it — retrying after Retry-After is expected
        and safe for any method. SERVICE_UNAVAILABLE means a broker-level fault
        that retrying will not fix.
      headers:
        Retry-After:
          description: Seconds to wait before retrying. Sent with SERVICE_WAKING only.
          required: false
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
