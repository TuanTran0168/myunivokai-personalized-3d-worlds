; Runs all eight backend processes this repo normally deploys as eight
; separate Render web services. See ../README.md for the platform this
; targets and ../.env.example for every %(ENV_X)s value referenced below —
; supervisord expands that syntax from whatever the container's own
; environment holds, which is how eight binaries that each expect a
; generically-named DATABASE_URL/NATS_URL end up pointed at eight different
; managed databases sharing one NATS connection.
;
; Literal (non-%(ENV_X)s) values below are copied straight from render.yaml
; — they are this repo's already-decided production defaults, not something
; a single-container deploy should need to re-decide.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; SERVICE_WAKE_PLATFORM is "none" below, not "http": every backend process
; is already running in this same container the whole time it's up — there
; is no sleeping sibling to wake. That mechanism exists only for Render's
; one-container-per-service shape; leaving it at "http" here would make the
; gateway try to HTTP-ping its own siblings' /healthz for no reason.
[program:gateway]
directory=/app/gateway
command=/app/gateway/api-gateway
user=app
priority=100
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=
    APP_ENV="production",
    API_HOST="0.0.0.0",
    API_PORT="%(ENV_PORT)s",
    TRUST_PROXY="true",
    API_ALLOWED_ORIGINS="%(ENV_API_ALLOWED_ORIGINS)s",
    NATS_URL="%(ENV_NATS_URL)s",
    NATS_CREDENTIALS="/app/secrets/nats.creds",
    NATS_CONNECT_TIMEOUT="5s",
    NATS_RECONNECT_WAIT="2s",
    NATS_PUBLISH_TIMEOUT="5s",
    NATS_REQUEST_TIMEOUT="3s",
    REDIS_URL="%(ENV_REDIS_URL)s",
    REDIS_KEY_PREFIX="myunivokai",
    RATE_LIMIT_REQUESTS_PER_SECOND="2",
    RATE_LIMIT_BURST="20",
    JOB_CACHE_TTL="30s",
    WORLD_CACHE_TTL="60s",
    SHARE_CACHE_TTL="60s",
    ADMIN_ROUTES_ENABLED="%(ENV_ADMIN_ROUTES_ENABLED)s",
    ADMIN_ALLOWED_ORIGIN="%(ENV_ADMIN_ALLOWED_ORIGIN)s",
    ADMIN_RATE_LIMIT_REQUESTS_PER_SECOND="10",
    ADMIN_RATE_LIMIT_BURST="50",
    ADMIN_ACCESS_PUBLIC_KEYS="%(ENV_ADMIN_ACCESS_PUBLIC_KEYS)s",
    ADMIN_TOKEN_VERSION_CACHE_TTL="360h",
    SERVICE_WAKE_PLATFORM="none",
    TELEMETRY_ENABLED="%(ENV_TELEMETRY_ENABLED)s",
    TELEMETRY_FLUSH_INTERVAL="60s"

; Every one of the six Go workers below (dna/universe/nature/ocean/auth/
; analytics) defaults its bare /healthz server to :8080 when PORT is unset
; (see cmd/service/main.go's defaultHealthCheckPort) — harmless when each is
; its own Render container, fatal here, where all eight share one network
; namespace and the second process to bind :8080 crashes on boot. Each gets
; its own fixed port below for exactly that reason; nothing outside this
; container reads any of them, since only api-gateway is reverse-facing.
;
; NOTE for every [program:*] block's `environment=` value below: this is a
; ConfigParser multi-line continuation — every line up to the next blank
; line or new key is concatenated into ONE value, so a `;` comment placed
; INSIDE one of these blocks would be parsed as literal text, not stripped.
; Keep every explanatory comment outside the `environment=` blocks, as this
; one is.
[program:dna]
directory=/app/dna
command=/app/dna/dna-service
user=app
priority=200
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=
    APP_ENV="production",
    PORT="8082",
    MIGRATIONS_DIR="/app/dna/migrations",
    DATABASE_URL="%(ENV_DNA_DATABASE_URL)s",
    DATABASE_DIRECT_URL="%(ENV_DNA_DATABASE_DIRECT_URL)s",
    NATS_URL="%(ENV_NATS_URL)s",
    NATS_CREDENTIALS="/app/secrets/nats.creds",
    NATS_CONNECT_TIMEOUT="5s",
    NATS_RECONNECT_WAIT="2s",
    NATS_PUBLISH_TIMEOUT="5s",
    NATS_ACK_WAIT="2m",
    NATS_MAX_DELIVER="5",
    NATS_FETCH_BATCH_SIZE="1",
    NATS_FETCH_MAX_WAIT="1s",
    NATS_RETRY_DELAY="2s",
    NATS_QUERY_TIMEOUT="2500ms",
    OUTBOX_POLL_INTERVAL="500ms",
    OUTBOX_BATCH_SIZE="50",
    AI_PROVIDER="%(ENV_AI_PROVIDER)s",
    AI_FALLBACK_PROVIDER="mock",
    AI_ENABLE_FALLBACK="true",
    GEMINI_API_KEY="%(ENV_GEMINI_API_KEY)s",
    OPENAI_API_KEY="%(ENV_OPENAI_API_KEY)s"

