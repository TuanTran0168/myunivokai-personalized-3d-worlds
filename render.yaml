      - key: DATABASE_URL
        sync: false
      - key: DATABASE_DIRECT_URL
        sync: false
      - key: NATS_URL
        sync: false
      - key: NATS_USERNAME
        sync: false
      - key: NATS_PASSWORD
        sync: false
      - key: NATS_CONNECT_TIMEOUT
        value: 5s
      - key: NATS_RECONNECT_WAIT
        value: 2s
      - key: NATS_PUBLISH_TIMEOUT
        value: 5s
      - key: NATS_ACK_WAIT
        value: 2m
      - key: NATS_MAX_DELIVER
        value: "5"
      - key: NATS_FETCH_BATCH_SIZE
        value: "1"
      - key: NATS_FETCH_MAX_WAIT
        value: 1s
      - key: NATS_RETRY_DELAY
        value: 2s
      - key: NATS_QUERY_TIMEOUT
        value: 2500ms
      - key: OUTBOX_POLL_INTERVAL
        value: 500ms
      - key: OUTBOX_BATCH_SIZE
        value: "50"
      - key: AI_PROVIDER
        value: mock
      - key: AI_FALLBACK_PROVIDER
        value: mock
      - key: AI_ENABLE_FALLBACK
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: myunivokai-universe
    runtime: docker
    dockerfilePath: ./services/universe-service/Dockerfile.prod
    dockerContext: .
    plan: free
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: MIGRATIONS_DIR
        value: /app/migrations
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_DIRECT_URL
        sync: false
      - key: NATS_URL
        sync: false
      - key: NATS_USERNAME
        sync: false
      - key: NATS_PASSWORD
        sync: false
      - key: NATS_CONNECT_TIMEOUT
        value: 5s
      - key: NATS_RECONNECT_WAIT
        value: 2s
      - key: NATS_PUBLISH_TIMEOUT
        value: 5s
      - key: NATS_ACK_WAIT
        value: 2m
      - key: NATS_MAX_DELIVER
        value: "5"
      - key: NATS_FETCH_BATCH_SIZE
        value: "1"
      - key: NATS_FETCH_MAX_WAIT
        value: 1s
      - key: NATS_RETRY_DELAY
        value: 2s
      - key: NATS_QUERY_TIMEOUT
        value: 2500ms
      - key: OUTBOX_POLL_INTERVAL
        value: 500ms
      - key: OUTBOX_BATCH_SIZE
        value: "50"
      - key: PUBLIC_WEB_URL
        sync: false

  - type: web
    name: myunivokai-auth
    runtime: docker
    dockerfilePath: ./services/auth-service/Dockerfile.prod
    dockerContext: .
    plan: free
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: MIGRATIONS_DIR
        value: /app/migrations
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_DIRECT_URL
        sync: false
      # NOT linked to myunivokai-env-prod as of the 2026-08-22 Render API
      # check in this file's top comment — same caveat as myunivokai-gateway.
      - key: NATS_URL
        sync: false
      - key: NATS_USERNAME
        sync: false
      - key: NATS_PASSWORD
        sync: false
      - key: NATS_CONNECT_TIMEOUT
        value: 5s
      - key: NATS_RECONNECT_WAIT
        value: 2s
      - key: NATS_QUERY_TIMEOUT
        value: 2500ms
      - key: REDIS_URL
        sync: false
      - key: REDIS_KEY_PREFIX
        value: myunivokai
      # Ed25519 seed, base64-encoded — generate ONE PER ENVIRONMENT
      # (`openssl rand -base64 32`), never reuse the local-dev value, never
      # put a real value in this file. Rotation: add a second key to the
      # gateway's accepted-public-keys list before removing the old one, so
      # no session is force-logged-out — see
      # agent-system/plans/services/auth-and-admin-plan.md#tokens.
      - key: AUTH_ACCESS_PRIVATE_KEY
        sync: false
      - key: AUTH_ACCESS_TOKEN_TTL
        value: 10m
      - key: AUTH_REFRESH_TOKEN_TTL
        value: 336h
      - key: AUTH_TOKEN_VERSION_CACHE_TTL
        value: 360h
      - key: AUTH_INVITE_TOKEN_TTL
        value: 168h
      - key: AUTH_ARGON2_MEMORY_KIB
        value: "19456"
      - key: AUTH_ARGON2_ITERATIONS
        value: "2"
      - key: AUTH_ARGON2_PARALLELISM
        value: "1"
      - key: AUTH_ARGON2_SALT_LENGTH
        value: "16"
      - key: AUTH_ARGON2_KEY_LENGTH
        value: "32"
      - key: AUTH_MAX_FAILED_ATTEMPTS
        value: "5"
      - key: AUTH_LOCKOUT_DURATION
        value: 15m

  # The admin read model. Consumes myunivokai.events.>, writes its own Neon
  # database, answers myunivokai.queries.analytics.>. It publishes no domain
  # subject and calls no other service, so it has no outbox settings and no
  # provider keys — see agent-system/plans/services/analytics-service-plan.md.
  #
  # Service created on Render 2026-08-22 and already linked to the
  # myunivokai-env-prod group (verified live via the Render API the same day
  # — see this file's top comment). STILL OUTSTANDING: DATABASE_URL /
  # DATABASE_DIRECT_URL are not filled in yet — the Neon database for
  # analytics has not been created (deploy/single-container/.env's own
  # ANALYTICS_DATABASE_URL is still a TODO for the same reason). Without them
  # the service crash-loops on first boot. NATS_USERNAME / NATS_PASSWORD
  # below stay unset on purpose: they are dead once the group is linked (see
  # top comment) — production is one shared Synadia user with no per-service
  # allow-list; infra/nats/nats-server.conf's per-user ACL blocks are LOCAL
  # ONLY (see that file's own top comment and
  # agent-system/skills/production-deployment-guide.md §1). This is also the sixth free
  # web service on the account — verify the instance-hour budget. The runbook
  # is services/analytics-service/README.md.
  - type: web
    name: myunivokai-analytics
    runtime: docker
    dockerfilePath: ./services/analytics-service/Dockerfile.prod
    dockerContext: .
    plan: free
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: MIGRATIONS_DIR
        value: /app/migrations
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_DIRECT_URL
        sync: false
      - key: NATS_URL
        sync: false
      - key: NATS_USERNAME
        sync: false
      - key: NATS_PASSWORD
        sync: false
      - key: NATS_CONNECT_TIMEOUT
        value: 5s
      - key: NATS_RECONNECT_WAIT
        value: 2s
      - key: NATS_QUERY_TIMEOUT
        value: 2500ms
      - key: NATS_ACK_WAIT
        value: 2m
      # Larger than the family services' batch of 1: a projection is one small
      # upsert rather than a long scene build, and batching keeps the read
      # model close to real time after a restart replays a backlog.
      - key: NATS_FETCH_BATCH_SIZE
        value: "25"
      - key: NATS_FETCH_MAX_WAIT
        value: 1s
      - key: NATS_RETRY_DELAY
        value: 2s
      - key: SERVICE_SHUTDOWN_TIMEOUT
        value: 15s

  # Operational telemetry, and the one service in this repository written in
  # Rust. Consumes myunivokai.events.telemetry.http.v1, writes its own Neon
  # database, answers myunivokai.queries.telemetry.>. It publishes no domain
  # subject and calls no other service — see
  # agent-system/plans/services/telemetry-service-plan.md and
  # services/telemetry-service/README.md.
  #
  # Service created on Render 2026-08-22 (the SEVENTH free web service on the
  # account — verify the instance-hour budget, the same caution already on
  # record for myunivokai-analytics as the sixth) but, verified live via the
  # Render API the same day, NOT YET LINKED to the myunivokai-env-prod group
  # (see this file's top comment) — link it in the dashboard before relying
  # on NATS. DATABASE_URL / DATABASE_DIRECT_URL already have real values (see
  # deploy/single-container/.env's TELEMETRY_DATABASE_URL) — fill them in on
  # the dashboard too. NATS_USERNAME / NATS_PASSWORD below stay unset on
  # purpose: they are dead once the group is linked — production is one
  # shared Synadia user with no per-service allow-list;
  # infra/nats/nats-server.conf's per-user ACL blocks are LOCAL ONLY. Without
  # the database vars the service crash-loops on first boot, deliberately: a
  # telemetry service that starts with no storage looks identical to a
  # working one until somebody opens the screen.
  #
  # Then set TELEMETRY_SERVICE_URL on myunivokai-gateway (blank on first sync,
  # like the other five) and TELEMETRY_ENABLED=true, and redeploy the gateway.
  #
  # No MIGRATIONS_DIR: sqlx embeds the migrations into the binary at compile
  # time, so this container cannot start with migrations that do not match its
  # own code.
  - type: web
    name: myunivokai-telemetry
    runtime: docker
    dockerfilePath: ./services/telemetry-service/Dockerfile.prod
    dockerContext: .
    plan: free
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      # postgres | otlp. postgres is the only sink the admin Telemetry screen
      # can render from; otlp forwards to Grafana Cloud and answers no range
      # query at all, which the screen shows as a link rather than an empty
      # chart. Switching sinks needs no code change and no redeploy of
      # anything else.
      - key: TELEMETRY_SINK
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_DIRECT_URL
        sync: false
      # Deliberately lower than the Go services' 10. This service opens one
      # short transaction per minute and a handful of reads per admin page
      # load; a free Neon project's connection budget is better spent on the
      # services in the product path.
      - key: DATABASE_MAX_CONNS
        value: "5"
      - key: NATS_URL
        sync: false
      - key: NATS_USERNAME
        sync: false
      - key: NATS_PASSWORD
        sync: false
      - key: NATS_CONNECT_TIMEOUT
        value: 5s
      - key: NATS_QUERY_TIMEOUT
        value: 2500ms
      - key: NATS_ACK_WAIT
        value: 2m
      - key: NATS_MAX_ACK_PENDING
        value: "1000"
      - key: NATS_RETRY_DELAY
        value: 2s
      # Retention is a delete, not a policy document. There is no
      # rollup-of-rollups: a bucket is already one minute wide, so the only
      # thing old data becomes is deleted.
      - key: TELEMETRY_RETENTION_DAYS
        value: "90"
      - key: TELEMETRY_RETENTION_SWEEP_INTERVAL
        value: 6h
      # TELEMETRY_SINK=otlp only. Authentication goes in the standard
      # OTEL_EXPORTER_OTLP_HEADERS variable so Grafana Cloud's own snippet
      # works unchanged rather than being translated by hand.
      - key: TELEMETRY_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false
      - key: TELEMETRY_DASHBOARD_URL
        sync: false
      - key: SERVICE_SHUTDOWN_TIMEOUT
        value: 15s
      - key: RUST_LOG
        value: info

