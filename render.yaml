# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Managed NATS, Redis, and four Neon URLs are supplied through the dashboard.
# Domain names describe responsibilities; Render's `worker` type describes the process.
#
# NATS_CREDENTIALS vs NATS_USERNAME/NATS_PASSWORD, verified against the live
# account via the Render API on 2026-08-22: the dashboard-only env var group
# "myunivokai-env-prod" holds NATS_URL + a nats.creds Secret File mounted at
# NATS_CREDENTIALS=/etc/secrets/nats.creds, and is currently linked to only
# FOUR services — myunivokai-dna, -nature, -universe, -analytics. Every
# service's own messaging/runtime.go picks credentials with
# `if NATSCredentialsFile != "" { UserCredentials(...) } else if NATSUsername
# != "" { UserInfo(...) }` — so on a linked service, NATS_CREDENTIALS from the
# group always wins and the NATS_USERNAME/NATS_PASSWORD sync:false entries
# below are dead, never read. On an UNLINKED service (myunivokai-gateway,
# -auth, -ocean, -telemetry as of this check) NATS_USERNAME/NATS_PASSWORD is
# the only path — and the values that would go there (a Synadia NGS JWT
# "name" as username, an NKEY seed as "password") do not actually mirror
# NGS's real auth mechanism (JWT+NKey challenge-response, not a password).
# Do not assume this fallback works without verifying it against a live
# service. The reliable fix is linking the four missing services to
# myunivokai-env-prod in the dashboard (blueprint sync cannot do this —
# group membership has no render.yaml representation), not filling in
# NATS_USERNAME/NATS_PASSWORD by hand.
services:
# =============================================================================
# Note: The personalization frontend (apps/myunivokai-personalization) is
# hosted on Vercel. Render does not need to deploy or manage this service.
# The Vercel deployment below is still named `myunivokai-web` on purpose: share
# URLs already handed out resolve through that name, so the folder rename does
# not move it. See the identity plan's section 17.
# =============================================================================
#  - type: web
#    name: myunivokai-web
#    runtime: docker
#    dockerfilePath: ./apps/myunivokai-personalization/Dockerfile.prod
#    dockerContext: ./apps/myunivokai-personalization
#    plan: free
#    autoDeployTrigger: checksPass
#    healthCheckPath: /
#    envVars:
#      - key: NEXT_PUBLIC_GATEWAY_BASE_URL
#        sync: false

  - type: web
    name: myunivokai-gateway
    runtime: docker
    dockerfilePath: ./services/api-gateway/Dockerfile.prod
    dockerContext: .
    plan: free
    autoDeployTrigger: checksPass
#    healthCheckPath: /api/v1/healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: API_ALLOWED_ORIGINS
        sync: false
      # NOT linked to myunivokai-env-prod as of the 2026-08-22 Render API
      # check in this file's top comment — this service is on the
      # NATS_USERNAME/NATS_PASSWORD fallback path, unverified against
      # Synadia NGS's real JWT+NKey auth. Verify NATS actually connects
      # before trusting this, or link the group instead.
      - key: NATS_URL
        sync: false
      - key: NATS_USERNAME
        sync: false
      - key: NATS_PASSWORD
        sync: false
      - key: NATS_CONNECT_TIMEOUT
        value: 5s
      - key: NATS_RECONNECT_WAIT
        value: 2s
      - key: NATS_PUBLISH_TIMEOUT
        value: 5s
      - key: NATS_REQUEST_TIMEOUT
        value: 3s
      - key: REDIS_URL
        sync: false
      - key: REDIS_KEY_PREFIX
        value: myunivokai
      - key: RATE_LIMIT_REQUESTS_PER_SECOND
        value: "2"
      - key: RATE_LIMIT_BURST
        value: "20"
      - key: JOB_CACHE_TTL
        value: 30s
      - key: WORLD_CACHE_TTL
        value: 60s
      - key: SHARE_CACHE_TTL
        value: 60s
      # The identity endpoints' own token bucket (S8-IDENTITY-002). Far
      # tighter than RATE_LIMIT_* above because the traffic is different: a
      # person signs in a handful of times a day, while the product bucket has
      # to absorb every world read. The gateway refuses to start if this is
      # the looser of the two. The per-email failure counter that backs it up
      # is a Go constant with no key here on purpose — see
      # services/api-gateway/internal/config/config.go's identityFailureLimit.
      - key: AUTH_RATE_LIMIT_REQUESTS_PER_SECOND
        value: "1"
      - key: AUTH_RATE_LIMIT_BURST
        value: "10"
      # Turned on 2026-08-22 for the full production deploy. Requires BOTH
      # ADMIN_ALLOWED_ORIGIN and ADMIN_ACCESS_PUBLIC_KEYS (below, sync:false)
      # to already hold real values on the live Render dashboard — an
      # empty/wildcard origin or an empty key list fails config validation
      # and the whole gateway (product routes included) refuses to start. As
      # of this edit: ADMIN_ALLOWED_ORIGIN was set live via the Render API to
      # https://myunivokai-admin.vercel.app. ADMIN_ACCESS_PUBLIC_KEYS and
      # auth-service's own AUTH_ACCESS_PRIVATE_KEY were generated the same
      # day but could NOT be set via the API (blocked by an automated
      # safety check on writing key-shaped secrets) — confirm both are set
      # on the dashboard before this file is merged/deployed to main, or
      # the gateway will crash-loop on boot. See
      # agent-system/plans/services/auth-and-admin-plan.md#amended--one-gateway-two-route-groups.
      - key: ADMIN_ROUTES_ENABLED
        value: "true"
      - key: ADMIN_ALLOWED_ORIGIN
        sync: false
      - key: ADMIN_RATE_LIMIT_REQUESTS_PER_SECOND
        value: "10"
      - key: ADMIN_RATE_LIMIT_BURST
        value: "50"
      # Public half of myunivokai-auth's AUTH_ACCESS_PRIVATE_KEY, never the
      # private key itself. Comma-separated for key rotation (S4-AUTH-005):
      # list the new key alongside the outgoing one until every session has
      # re-authenticated, then remove the old one.
      #
      # No longer admin-only, despite the name. Since S8-IDENTITY-002 the same
      # key verifies the product session on /api/auth and /api/me, so the
      # gateway now requires it whether or not ADMIN_ROUTES_ENABLED is true.
      # The key name is kept because it is a live secret in this account's
      # environment; the gateway's Go field is AccessTokenPublicKeys.
      - key: ADMIN_ACCESS_PUBLIC_KEYS
        sync: false
      - key: ADMIN_TOKEN_VERSION_CACHE_TTL
        value: 360h
      # Every service below is a pure NATS consumer with no inbound HTTP, and
      # a free instance wakes only on inbound HTTP — so nothing in normal
      # operation ever wakes one, and a query against a sleeping service gets
      # an instant no-responders reply. "http" makes the gateway start them
      # on demand; see agent-system/plans/architecture/service-wake-mechanism.md.
      #
      # This is a hosting workaround with an explicit exit: on a paid plan or
      # a real background worker, set this to "none" and nothing else changes.
      # Every service announces its own boot on
      # myunivokai.events.<name>.service.started.v1 and analytics-service
      # stores it. The version reported comes from SERVICE_VERSION when set,
      # otherwise from Render's own RENDER_GIT_COMMIT, otherwise "unknown" -
      # a container image carries no Go VCS stamp, and a wrong version is
      # worse than an absent one. Set this only to override the commit.
      # - key: SERVICE_VERSION
      #   sync: false
      - key: SERVICE_WAKE_PLATFORM
        value: http
      # sync: false rather than hardcoded .onrender.com URLs, so moving a
      # service to another host is a dashboard edit instead of a repo change.
      # A service left unset is simply not wakeable and keeps reporting plain
      # SERVICE_UNAVAILABLE. Validated at startup: scheme + host, no path.
      #
      # LEAVE THESE BLANK ON THE FIRST SYNC OF THIS BLUEPRINT. They must be the
      # services' PUBLIC URLs, which do not exist until this same sync has
      # created the services - and fromService/property: host cannot be used
      # instead, because that yields the private hostname and Render free web
      # services cannot receive private network traffic at all, so a request
      # there would never wake anything. Fill them in after the first deploy
      # and redeploy the gateway; it starts fine without them and logs which
      # services it can actually reach on every boot.
      - key: DNA_SERVICE_URL
        sync: false
      - key: UNIVERSE_SERVICE_URL
        sync: false
      - key: NATURE_SERVICE_URL
        sync: false
      - key: OCEAN_SERVICE_URL
        sync: false
      - key: AUTH_SERVICE_URL
        sync: false
      - key: ANALYTICS_SERVICE_URL
        sync: false
      - key: TELEMETRY_SERVICE_URL
        sync: false
      # Raised from 5s to 45s on 2026-09-04, and set live on the dashboard the
      # same day — this line exists so the next blueprint sync does not put
      # 5s back. 5s could not cover a cold start: measured first-byte on a
      # sleeping instance's /healthz was 7.3s (dna), 12.7s (nature), 13.3s
      # (universe), so every wake call was abandoned before the host had
      # finished starting anything.
      #
      # It costs nothing on the request path. Coordinator.Wake runs detached
      # (`go wakeDetached`) and the client response has already been written,
      # so this bounds one goroutine and one outbound connection, never the
      # gateway's own 8s WriteTimeout.
      #
      # Raising it did NOT fix the fleet, which is worth knowing before
      # somebody raises it further: with 45s available the wake still returned
      # inside one second and ocean-service still never started. Whatever
      # answers these calls is not the sleeping instance. See
      # DEFECT-WAKE-001 in agent-system/plans/backlog/engineering-backlog.md.
      - key: SERVICE_WAKE_TIMEOUT
        value: 45s
      - key: SERVICE_WAKE_LOCK_TTL
        value: 60s
      - key: SERVICE_WAKE_RETRY_AFTER
        value: 15s
      # Off until myunivokai-telemetry exists and has been verified — with it
      # off the gateway registers no telemetry middleware, runs no ticker and
      # publishes nothing, so this is the same request path the previous
      # deploy served. Flipping it to "true" starts filling
      # MYUNIVOKAI_EVENTS with one rollup envelope per minute whether or not
      # a consumer exists yet, which is deliberate: envelopes accumulate on
      # the stream the same way analytics' events did before that service was
      # built. See agent-system/plans/services/telemetry-service-plan.md.
      - key: TELEMETRY_ENABLED
        value: "false"
      - key: TELEMETRY_FLUSH_INTERVAL
        value: 60s

  - type: web
    name: myunivokai-dna
    runtime: docker
    dockerfilePath: ./services/dna-service/Dockerfile.prod
    dockerContext: .
    plan: free
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
